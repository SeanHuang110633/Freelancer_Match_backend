version: "3.8"
services:
  db_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freelancer_test_db
    ports:
      - "3307:3306" # 對應到本機 3307，避開開發用的 3306
    # 優化測試性能，關閉 log
    command: --default-authentication-plugin=mysql_native_password --general-log=0 --slow-query-log=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379" # 對應到本機 6380
