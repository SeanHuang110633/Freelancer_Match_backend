# 這會告訴 Pytest 如何處理非同步測試以及環境變數
[pytest]
# 將專案根目錄加入 Python Path，確保能正確 import app.*
pythonpath = .

# 啟用 asyncio 模式，這對 FastAPI 測試至關重要
asyncio_mode = auto

# 設定測試報告的顯示格式
addopts = --strict-markers --disable-warnings

# 模擬環境變數 (防止測試時嘗試連線真實服務)
; env =
;     DATABASE_URL=sqlite+aiosqlite:///:memory:
;     REDIS_URL=redis://mock-redis-host:6379/0
;     # 強制設定為 local 模式，避免初始化 GCS Client
;     FILE_STORAGE_MODE=local 
;     JWT_SECRET_KEY=test_secret_key_for_unit_tests